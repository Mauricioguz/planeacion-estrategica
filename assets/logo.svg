<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Radial & Linear Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1715" />
      <stop offset="100%" stop-color="#0c0a09" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faedcd" />
      <stop offset="50%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#b07d4b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="250" cy="250" r="235" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7" />
  <circle cx="250" cy="250" r="212" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.9" />

  <!-- Mountain Silhouette (Origen Finca La Leonora) -->
  <g transform="translate(250, 155)">
    <!-- Main Peaks -->
    <path d="M -110 35 L -65 -15 L -25 15 L 20 -35 L 75 20 L 110 35 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M -65 -15 L -45 35 M 20 -35 L 0 35 M 75 20 L 60 35" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  </g>

  <!-- Script: Finca la Leonora -->
  <text x="250" y="222" 
        text-anchor="middle" 
        font-family="'Playfair Display', Georgia, serif" 
        font-style="italic" 
        font-size="28" 
        fill="#faedcd" 
        letter-spacing="1">
    Finca la Leonora
  </text>

  <!-- Horizontal Divider with Diamond -->
  <line x1="85" y1="240" x2="225" y2="240" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8" />
  <polygon points="250,235 255,240 250,245 245,240" fill="url(#goldGrad)" />
  <line x1="275" y1="240" x2="415" y2="240" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8" />

  <!-- Main Brand Name: GHALOCAFE -->
  <text x="250" y="286" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Times New Roman', Georgia, serif" 
        font-size="44" 
        font-weight="700" 
        letter-spacing="5" 
        fill="url(#goldGrad)">
    GHALOCAFE
  </text>

  <!-- Dot accent like in ghalocafe.com -->
  <circle cx="410" cy="282" r="6" fill="#d4a373" filter="url(#goldGlow)" />

  <!-- Subtitle: CAFÉ DE ORIGEN -->
  <text x="250" y="322" 
        text-anchor="middle" 
        font-family="'Outfit', -apple-system, sans-serif" 
        font-size="16" 
        font-weight="600" 
        letter-spacing="6" 
        fill="#a3958c">
    CAFÉ DE ORIGEN
  </text>

  <!-- Bottom Coffee Branch with Cherries -->
  <g transform="translate(250, 360)">
    <!-- Central branch -->
    <path d="M -90 10 Q -40 25 0 15 Q 40 5 90 20" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Leaves Left -->
    <path d="M -60 18 Q -75 5 -65 -10 Q -50 0 -60 18 Z" fill="url(#emeraldGrad)" opacity="0.9" stroke="url(#goldGrad)" stroke-width="1" />
    <path d="M -30 20 Q -45 35 -30 45 Q -20 30 -30 20 Z" fill="url(#emeraldGrad)" opacity="0.9" stroke="url(#goldGrad)" stroke-width="1" />
    
    <!-- Leaves Right -->
    <path d="M 30 13 Q 45 -2 35 -12 Q 20 0 30 13 Z" fill="url(#emeraldGrad)" opacity="0.9" stroke="url(#goldGrad)" stroke-width="1" />
    <path d="M 60 16 Q 75 32 60 42 Q 50 28 60 16 Z" fill="url(#emeraldGrad)" opacity="0.9" stroke="url(#goldGrad)" stroke-width="1" />
    
    <!-- Coffee Cherries / Berries -->
    <circle cx="-12" cy="18" r="8" fill="#d4a373" stroke="#faedcd" stroke-width="1.2" />
    <circle cx="5" cy="14" r="9" fill="#b07d4b" stroke="#faedcd" stroke-width="1.2" />
    <circle cx="20" cy="22" r="7.5" fill="#d4a373" stroke="#faedcd" stroke-width="1.2" />
  </g>

  <!-- Circular Bottom Tagline: WWW.GHALOCAFE.COM -->
  <text x="250" y="425" 
        text-anchor="middle" 
        font-family="'Outfit', sans-serif" 
        font-size="12" 
        font-weight="600" 
        letter-spacing="4" 
        fill="#faedcd" 
        opacity="0.85">
    WWW.GHALOCAFE.COM
  </text>
</svg>
