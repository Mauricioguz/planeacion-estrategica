# render.yaml - Configuración de Despliegue en Render
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: planeacion-estrategica-finca-leonora
    env: node
    plan: free
    region: oregon # O la región más cercana a tu base de datos Neon (ej. ohi / frankfurt)
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: DATABASE_URL
        sync: false # Configurar en el Dashboard de Render con el connection string de Neon
